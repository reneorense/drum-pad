<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>Drum Pad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="bar">
      <button id="playBtn" class="btn primary">▶ Play</button>
      <button id="recBtn" class="btn rec">● Rec</button>
      <button id="clearBtn" class="btn ghost">Clear</button>
      <div class="spacer"></div>
      <div class="field"><label for="bpm">BPM</label>
        <input id="bpm" type="number" min="40" max="240" value="100">
      </div>
      <button id="tapBtn" class="btn ghost">Tap</button>
      <select id="bars">
        <option value="1">1 bar</option>
        <option value="2">2 bars</option>
        <option value="4">4 bars</option>
      </select>
    </div>

    <div class="pads" id="pads"></div>
    <div class="strip" id="strip"></div>

    <div class="foot">
      <button id="assignBtn" class="btn ghost">Assign sounds</button>
      <div class="field" style="flex:1">
        <label for="vol">Vol</label>
        <input id="vol" type="range" min="0" max="100" value="80">
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
